services:
  # ── Django Backend ────────────────────────────────────────────────────────
  - type: web
    name: breathe-esg-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn core.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: breathe-esg-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.0"
    autoDeploy: true
    healthCheckPath: /api/

  # ── React Frontend ────────────────────────────────────────────────────────
  - type: web
    name: breathe-esg-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false   # Set this to your backend URL e.g. https://breathe-esg-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: true

databases:
  - name: breathe-esg-db
    databaseName: breathe_esg
    user: breathe_esg
    plan: free
